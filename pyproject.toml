[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedcharge-rl"
version = "0.1.0"
description = "Reproducible federated tabular Q-learning benchmark for solar-assisted e-bike charging"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Md Aminul Islam"}]
keywords = ["federated-learning", "reinforcement-learning", "iot", "smart-charging", "electric-bikes"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence", "Development Status :: 3 - Alpha"]
dependencies = []

[project.scripts]
fedcharge = "fedcharge.experiment:main"

[tool.setuptools.packages.find]
include = ["fedcharge*"]
